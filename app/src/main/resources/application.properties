# iflowlab — local single-user workbench.

# R10 hard constraint: never network-reachable. Bind loopback only.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080

# Quinoa: build + bundle the React SPA (src/main/webui) into the jar (D1).
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true

# Backend tests don't need the UI built — keep @QuarkusTest fast and node-free.
%test.quarkus.quinoa.enabled=false

# Workspace root the run/file endpoints operate on (default = CWD; --workspace overrides).
iflowlab.workspace=${user.dir}

# MRU list of opened workspaces (slice 9), persisted across restarts.
iflowlab.recents-file=${user.home}/.iflowlab/recent-workspaces.txt
# Tests must not touch the real home directory.
%test.iflowlab.recents-file=${java.io.tmpdir}/iflowlab-test-recents.txt

# --- runner profile (SaaS R2, iflowlab-cloud ADR-0001/0002) ---
# The jar as a stateless execution service behind a control plane: reachable on the
# container network (R10 loopback stays the default profile's guarantee), no workspace,
# workspace endpoints hidden, X-Runner-Token required when configured (set via the
# IFLOWLAB_RUNNER_TOKEN env var). Local product behavior is untouched.
%runner.quarkus.http.host=0.0.0.0
%runner.iflowlab.workspace=${java.io.tmpdir}/iflowlab-runner-empty
%runner.iflowlab.recents-file=${java.io.tmpdir}/iflowlab-runner-recents.txt
%runner.iflowlab.runner-mode=true
iflowlab.runner-mode=false
# iflowlab.runner-token is intentionally NOT defined here (SmallRye treats an empty
# String property as null and fails injection); it defaults to "" at the injection
# points and is supplied via the IFLOWLAB_RUNNER_TOKEN env var in containers.
